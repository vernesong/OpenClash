<%+cbi/valueheader%>
<% local action_id = self:cbid(section) .. ".action" %>
<div style="white-space: nowrap">
    <input type="hidden" id="<%=pcdata(action_id)%>" name="cbid.<%=self.map.config%>.<%=section%>.actions" />
    <button type="submit" hidden name="<%=self:cbid(section)%>" value="1" tabindex="-1" aria-hidden="true"></button>
    <% if is_yaml then %>
    <input type="submit" class="btn cbi-button cbi-input-apply" name="<%=self:cbid(section)%>" value="<%:SwiTch%>" onclick="document.getElementById('<%=action_id%>').value='switch'" />
    <% end %>
    <input type="submit" class="btn cbi-button cbi-input-apply" name="<%=self:cbid(section)%>" value="<%:Edit%>" onclick="document.getElementById('<%=action_id%>').value='edit'" />
    <input type="submit" class="btn cbi-button cbi-input-apply" name="<%=self:cbid(section)%>" value="<%:Download%>" onclick="document.getElementById('<%=action_id%>').value='download'" />
    <span class="oc-actions-menu">
        <button type="button" class="btn cbi-button oc-actions-menu-btn" title="<%:Other%>" aria-label="<%:Other%>" aria-haspopup="true" onclick="return configRowMenu(this)">&#8943;</button>
        <select class="cbi-input-select" tabindex="-1" aria-hidden="true" title="<%:Other%>" data-file="<%=pcdata(config_name)%>" onchange="return configRowAction(this, '<%=action_id%>')">
            <option value="" selected disabled hidden></option>
            <option value="servers_manage"><%:Servers Manage%></option>
            <option value="rename"><%:Rename%></option>
            <% if is_yaml then %><option value="copy"><%:Copy Config%></option><% end %>
            <% if has_running then %><option value="download_run"><%:Download Running Config%></option><% end %>
            <option value="remove"><%:Remove%></option>
        </select>
    </span>
</div>
<% if config_script then %>
<script>
window.configRowAction = function(select, id) {
    var action = select.value;
    var file = select.dataset.file;
    select.value = '';
    if (!action) return false;
    if (action === 'rename') {
        ocPrompt('<%:Paste the new file name (including the extension) here:%>', file, function(value, setError, close) {
            if (!value) return;
            if (!/\.ya?ml$/.test(value)) {
                setError('<%:Illegal extension!%>');
                return;
            }
            XHR.get('<%=luci.dispatcher.build_url("admin", "services", "openclash", "rename_file")%>', {new_file_name: value, file_path: '/etc/openclash/config/', file_name: file}, function(x) {
                if (x && x.status === 200) { close(); location.reload(); }
                else setError('<%:Rename Failed%>');
            });
        });
        return false;
    }
    if (action === 'remove' && !window.confirm('<%:Remove%> ' + file + '?')) return false;
    document.getElementById(id).value = action;
    select.parentNode.parentNode.querySelector('button[type="submit"]').click();
    return false;
};
window.configRowMenu = function(btn) {
    var select = btn.nextElementSibling;
    if (!select) return false;
    if (select.showPicker) {
        try { select.showPicker(); return false; } catch (e) {}
    }
    select.focus();
    return false;
};
</script>
<% end %>
<%+cbi/valuefooter%>
