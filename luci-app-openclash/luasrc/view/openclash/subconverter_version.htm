<div class="oc-subconverter-version-loader" hidden></div>
<script type="text/javascript">//<![CDATA[
document.addEventListener('DOMContentLoaded', function() {
	ocRequireScript('/luci-static/resources/openclash/js/subconverter-version.js?v=@OPENCLASH_VERSION@', function() {
		ocRequireScript('<%=luci.dispatcher.build_url("admin", "services", "openclash", "translate_js")%>?f=subconverter_source&v=@OPENCLASH_VERSION@&l=' + (window.ocLang || ''), function() {
			var selectSelector = 'div[id$=".convert_address"].cbi-dropdown, select[name$=".convert_address"], input[name$=".convert_address"]';
			var status = document.getElementById('subconverter-version-status-cbi');
			if (!window.OpenClashSubconverterVersion || !document.querySelector(selectSelector) || !status) return;
			var address = document.querySelector('textarea[name$=".address"]');
			var editor = window.OpenClashSubconverterSource && window.OpenClashSubconverterSource.init(address);
			var form = address && address.closest('form');
			if (editor && form) form.addEventListener('submit', function(event) {
				if (!editor.validate()) event.preventDefault();
			});
			window.OpenClashSubconverterVersion.init({
				select: selectSelector,
				enable: document.querySelector('input[type="checkbox"][name$=".sub_convert"]'),
				status: status,
				watchRoot: status.closest ? status.closest('.cbi-value') : null,
				watchDocument: true,
				proxyURL: '<%=luci.dispatcher.build_url("admin", "services", "openclash", "subconverter_version")%>',
				labels: {
					checking: '<%:Checking backend version...%>',
					versionPrefix: '<%:Backend Version%>',
					empty: '<%:Please enter backend URL%>',
					invalid: '<%:Invalid backend URL%>',
					unrecognized: '<%:Backend version information not detected%>',
					failed: '<%:Unable to detect backend version%>'
				},
				onSelectionChange: function() { if (editor) editor.setBackend('unknown'); },
				onResult: function(result) {
					if (editor) editor.setBackend(result.state === 'disabled' ? 'disabled' : result.family);
				}
			});
		});
	});
});
//]]></script>
