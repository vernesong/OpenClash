<%+cbi/valueheader%>
<link rel="stylesheet" href="/luci-static/resources/openclash/css/oc-common.css?v=@OPENCLASH_VERSION@">
<link rel="stylesheet" href="/luci-static/resources/openclash/css/oc-config.css?v=@OPENCLASH_VERSION@">
<script src="/cgi-bin/luci/admin/services/openclash/translate_js?f=common&v=@OPENCLASH_VERSION@&l=<%=luci.i18n.context.lang%>"></script>
<script type="text/javascript">if (window.ocRequireCM6) ocRequireCM6();</script>
<div class="oc">
<div class="upload-bar">
	<label for="file_type"><%:Upload File Type%>:</label>
	<div class="form-select-wrapper oc-w-auto">
		<select name="file_type" id="file_type" class="form-select">
			<option value="config" selected="selected"><%:Config File%> (.yaml)</option>
			<option value="proxy-provider"><%:Proxy Provider File%></option>
			<option value="rule-provider"><%:Rule Provider File%></option>
			<option value="clash_meta">[Meta] <%:Core File%> (.tar.gz)</option>
			<option value="backup-file"><%:Backup File%> (.tar.gz)</option>
		</select>
	</div>
	<input type="file" id="ulfile" name="ulfile" class="form-file" />
	<div class="config-upload-buttons">
		<button type="submit" class="btn" name="upload" id="upload-submit" disabled>
			<svg width="14" height="14"><use href="#oc-icon-upload"/></svg>
			<span id="upload-submit-label"><%:Upload%></span>
		</button>
		<button type="button" class="btn" onclick="return backup_all_file(this)">
			<svg width="14" height="14"><use href="#oc-icon-download"/></svg>
			<span><%:Backup%></span>
		</button>
	</div>
</div>
<%
	local msg = self:cfgvalue(section) or ""
%>
<div class="upload-note" id="upload-note">
	<div class="upload-note-default" id="upload-note-default"><%:Profiles are saved to the config directory (/etc/openclash/config)%></div>
	<% if msg and msg ~= "" then %>
	<div class="upload-result" id="upload-result"><%=pcdata(msg)%></div>
	<% else %>
	<div class="upload-result oc-hidden" id="upload-result"></div>
	<% end %>
</div>
</div>
<%+cbi/valuefooter%>

<script type="text/javascript" src="/cgi-bin/luci/admin/services/openclash/translate_js?f=upload&v=@OPENCLASH_VERSION@&l=<%=luci.i18n.context.lang%>"></script>
