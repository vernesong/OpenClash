<html>
<head>
<meta charset="utf-8">
<meta http-equiv="x-dns-prefetch-control" content="on">
<link rel="dns-prefetch" href="//whois.pconline.com.cn">
<link rel="dns-prefetch" href="//api.ip.sb">
<link rel="dns-prefetch" href="//api.ipify.org">
<link rel="dns-prefetch" href="//myip.ipip.net">
<link rel="preconnect" href="https://whois.pconline.com.cn">
<link rel="preconnect" href="https://api.ip.sb">
<link rel="preconnect" href="https://api.ipify.org">
<link rel="preconnect" href="https://myip.ipip.net">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,minimal-ui">
<title>IP 地址查询</title>
</head>

<fieldset class="cbi-section">
    <table width="100%">
        <tr>
            <td>
                <div class="oc">
                    <div class="myip-main-card">
                        <div class="myip-content-grid">
                            <div class="myip-ip-section">
                                <p class="myip-section-title">
                                    <%:IP Address%>
                                </p>

                                <div class="myip-ip-list">
                                    <div class="myip-card-item myip-ip-item">
                                        <span class="myip-card-label">PConline</span>
                                        <span class="myip-ip-addr" id="ip-pcol"></span>
                                        <span class="myip-ip-geo" id="ip-pcol-geo"></span>
                                    </div>

                                    <div class="myip-card-item myip-ip-item">
                                        <span class="myip-card-label">IPIP.NET</span>
                                        <span class="myip-ip-addr" id="ip-ipip"></span>
                                        <span class="myip-ip-geo" id="ip-ipip-geo"></span>
                                    </div>

                                    <div class="myip-card-item myip-ip-item">
                                        <span class="myip-card-label">IP.SB</span>
                                        <span class="myip-ip-addr" id="ip-ipsb"></span>
                                        <span class="myip-ip-geo" id="ip-ipsb-geo"></span>
                                    </div>

                                    <div class="myip-card-item myip-ip-item">
                                        <span class="myip-card-label">IPIFY</span>
                                        <span class="myip-ip-addr" id="ip-ipify"></span>
                                        <span class="myip-ip-geo" id="ip-ipify-geo"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="myip-check-section">
                                <p class="myip-section-title">
                                    <%:Access Check%>
                                    <span class="icon-pill myip-toolbar">
                                        <button type="button" class="icon-pill-opt" onclick="return privacy_my_ip(this)">
                                            <svg id="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" overflow="visible" xmlns="http://www.w3.org/2000/svg">
                                                <title><%:Hide IP%></title>
                                                <use id="eye-open" href="#oc-icon-eye" x="-2.5" y="-2.5" width="29" height="29"></use>
                                                <use id="eye-closed" class="oc-hidden" href="#oc-icon-eye-off" x="-2.5" y="-2.5" width="29" height="29"></use>
                                            </svg>
                                        </button>
                                        <button type="button" class="icon-pill-opt" onclick="return toggle_mode_by_icon(this)">
                                            <svg id="mode-icon" width="14" height="14" viewBox="0.4 1.4 47.2 47.2" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <title><%:Router Mode%></title>
                                                <rect class="mode-body" x="4" y="28" width="40" height="14" rx="2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                                <path class="mode-line" d="M14 35L22 35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                                <rect class="mode-dot" x="30" y="33" width="3" height="3" rx="1.5"/>
                                                <path class="mode-antenna" d="M12 28L12 8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                                <path class="mode-antenna" d="M36 28V8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                        <button type="button" class="icon-pill-opt" onclick="return refresh_myip(this)">
                                            <svg id="data-refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <title><%:Refresh%></title>
                                                <use href="#oc-icon-refresh" x="-0.8" y="-0.8" width="25.6" height="25.6"/>
                                            </svg>
                                        </button>
                                    </span>
                                </p>

                                <div class="myip-check-list">
                                    <div class="myip-card-item myip-check-item" data-svc="baidu">
                                        <span class="myip-card-label"><svg class="myip-card-icon ic-baidu"><use href="#oc-icon-brand-baidu"/></svg><span><%:Baidu Search%></span></span>
                                        <div class="myip-check-row">
                                            <span class="myip-latency" id="latency-baidu">--</span>
                                            <span class="myip-latency-unit">ms</span>
                                            <div class="myip-status-dot testing" id="dot-baidu" title="<%:Testing...%>"></div>
                                        </div>
                                        <div class="myip-sparkline-wrap" id="spark-baidu"></div>
                                    </div>

                                    <div class="myip-card-item myip-check-item" data-svc="163">
                                        <span class="myip-card-label"><svg class="myip-card-icon ic-netease"><use href="#oc-icon-brand-netease"/></svg><span><%:NetEase Music%></span></span>
                                        <div class="myip-check-row">
                                            <span class="myip-latency" id="latency-163">--</span>
                                            <span class="myip-latency-unit">ms</span>
                                            <div class="myip-status-dot testing" id="dot-163" title="<%:Testing...%>"></div>
                                        </div>
                                        <div class="myip-sparkline-wrap" id="spark-163"></div>
                                    </div>

                                    <div class="myip-card-item myip-check-item" data-svc="github">
                                        <span class="myip-card-label"><svg class="myip-card-icon ic-github"><use href="#oc-icon-brand-github"/></svg><span>GitHub</span></span>
                                        <div class="myip-check-row">
                                            <span class="myip-latency" id="latency-github">--</span>
                                            <span class="myip-latency-unit">ms</span>
                                            <div class="myip-status-dot testing" id="dot-github" title="<%:Testing...%>"></div>
                                        </div>
                                        <div class="myip-sparkline-wrap" id="spark-github"></div>
                                    </div>

                                    <div class="myip-card-item myip-check-item" data-svc="youtube">
                                        <span class="myip-card-label"><svg class="myip-card-icon ic-youtube"><use href="#oc-icon-brand-youtube"/></svg><span>YouTube</span></span>
                                        <div class="myip-check-row">
                                            <span class="myip-latency" id="latency-youtube">--</span>
                                            <span class="myip-latency-unit">ms</span>
                                            <div class="myip-status-dot testing" id="dot-youtube" title="<%:Testing...%>"></div>
                                        </div>
                                        <div class="myip-sparkline-wrap" id="spark-youtube"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="myip-footer">
                                <p>Powered by <a onclick="return ip_skk()" href="javascript:void(0);">ip.skk.moe</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</fieldset>

<script src="/luci-static/resources/openclash/js/oc-icons.js?v=<%="@OPENCLASH_VERSION@"%>"></script>
<script>
ocLazyScriptOnView(document.querySelector('.myip-main-card'), '/cgi-bin/luci/admin/services/openclash/translate_js?f=myip&v=<%="@OPENCLASH_VERSION@"%>&l=<%=luci.i18n.context.lang%>');
</script>
</html>
