<%+cbi/valueheader%>
<div>
<%
	local val = self:cfgvalue(section)
	if val == translate("Enable") or val == translate("Enabled") or val == translate("Config Normal") or val == translate("Exist") then
%>
     <div class="oc" style="color: var(--success-color); font-weight:bold;">
<%
  else
%>	
     <div class="oc" style="color: var(--error-color); font-weight:bold;">
<%	
  end
  write(pcdata(val))
%>
</div>
</div>
<%+cbi/valuefooter%>
